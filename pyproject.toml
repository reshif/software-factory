[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[project]
name = "software-factory"
version = "0.3.1"
description = "Portable repository software factory with optional JEV semantic assistance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "PyYAML>=6.0,<7", "tomlkit>=0.13,<1", "watchdog>=6,<7"]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
software-factory = "software_factory.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.uv.build-backend]
module-name = "software_factory"
module-root = "src"
source-include = ["tests/**", "scripts/**", "docs/implementation.md", "docs/release-process.md", "uv.lock", "AGENTS.md"]
