# OPT-IN override: mounts the HOST'S Docker socket into `controller`/`worker` so
# `DockerSandbox` can launch task containers directly (red-team #2 item 8).
#
#   docker compose -f docker-compose.yml -f docker-compose.docker-socket.yml up
#
# *** WARNING ***
# A container with `/var/run/docker.sock` can start a privileged container that
# mounts the host's root filesystem -- holding this socket is equivalent to root
# on the HOST, not just the container. Only use this on a host you are prepared
# to treat as fully accessible to whatever `controller`/`worker` run (which
# includes agent-driven task execution). See docker-compose.yml's "Running
# sandboxed tasks" note for the recommended alternative (a separate rootless
# Docker-in-Docker daemon reached over TCP+TLS, never a mounted socket).
#
# *** WHY THE SANDBOX/REPO-MIRROR VOLUMES CHANGE TOO, NOT JUST THE SOCKET ***
# `DockerSandbox.create`/`.exec` build a checkout under `FACTORY_SANDBOX_ROOT`
# (default `/var/lib/factory/sandboxes/<task-id>`) and shell out to
# `docker run -v <that path>:/work ...`. With the socket mounted, that `docker
# run` is executed BY THE HOST'S OWN DOCKER DAEMON, which resolves `-v` bind
# sources against paths ON THE HOST -- it has no idea `controller`/`worker` are
# containers at all, let alone what their filesystem namespace looks like.
# `docker-compose.yml`'s default `sandbox-images`/`repo-mirrors` are Compose
# NAMED VOLUMES: `/var/lib/factory/sandboxes` inside `controller`/`worker` is
# really stored under something like
# `/var/lib/docker/volumes/deploy_sandbox-images/_data` on the host, a path
# `DockerSandbox` never sees or passes to `docker run`. So with a named volume,
# the host daemon would either bind-mount an unrelated (likely nonexistent,
# auto-created empty) host directory at `/var/lib/factory/sandboxes/<task-id>`,
# or -- worse -- silently succeed against the wrong data.
#
# The fix: bind-mount the SAME host path at the IDENTICAL path inside
# `controller`/`worker`, so a `-v /var/lib/factory/sandboxes/<task-id>:/work`
# issued by `controller`/`worker` and resolved by the host daemon lands on the
# exact directory `SandboxPort.create` just populated. This only matters when
# the host socket is mounted (this override); the default compose file's named
# volumes are fine on their own, since nothing there calls out to the host
# daemon with a host-relative path.
#
# Create these two directories on the host (owned by whatever UID the
# container's `factory` user maps to, or world-writable for a quick trial)
# before starting -- Docker will auto-create them as root on first use
# otherwise, which `factory`-owned processes then can't write to.
services:
  controller:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/factory/sandboxes:/var/lib/factory/sandboxes
      - /var/lib/factory/repos:/var/lib/factory/repos
  worker:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/factory/sandboxes:/var/lib/factory/sandboxes
      - /var/lib/factory/repos:/var/lib/factory/repos
