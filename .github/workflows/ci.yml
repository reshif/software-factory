name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controller-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FACTORY_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    defaults:
      run:
        working-directory: factory-controller
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -v
      - name: Docker sandbox tests
        run: uv run pytest -v -m docker tests/sandbox
      - name: Demo scenarios
        if: hashFiles('factory-controller/src/factory/demo/**') != ''
        run: uv run factory demo --scenario all
