# Security floor: applies to every product and cannot be loosened.
# Spec: docs/software-factory-final-draft.md §13

schema_version: 1
policy_version: p-2026.10.3

# Agent diffs touching these are AC8 (rejected before push).
forbidden_paths:
  - ".github/**"
  - "policy/**"
  - "policies/**"
  - "evals/**"
  - "holdouts/**"
  - "**/.env"
  - "**/.env.*"
  - "**/*.pem"
  - "**/*.key"
  # Product control files: approvers, risk profile, checks, mandates, agent config (red team #2).
  - "factory.yaml"
  - "mandates/**"
  - "**/CODEOWNERS"
  - "**/.claude/**"
  - "**/CLAUDE.md"
  - "**/AGENTS.md"

# Agent diffs touching these are AC6 (approval with security role).
protected_paths:
  - "**/auth/**"
  - "**/crypto/**"
  - "**/payments/**"
  - "**/conftest.py"
  - "tests/fixtures/**"

# New files here are AC5 (additive migration); modifying or deleting existing ones is AC6.
migration_paths:
  - "migrations/**"
  - "**/migrations/**"

# Existing test files: modifying or deleting them is AC6; adding new ones is fine.
existing_tests_protected: true
test_globs: ["tests/**", "**/test_*.py", "**/*_test.py", "**/*.test.ts", "**/*.spec.ts"]

# Content patterns in added lines that indicate weakened checks (-> AC8).
weakening_patterns:
  - "@pytest.mark.skip"
  - "pytest.skip("
  - "it.skip("
  - "describe.skip("
  - "xit("
  - "sys.exit(0)"
  - "os._exit("
  - "pytest.exit("
  - "unittest.skip"
  - "@skip("
  - "--no-verify"

dependency_files: ["package.json", "package-lock.json", "pnpm-lock.yaml", "yarn.lock",
                   "pyproject.toml", "poetry.lock", "uv.lock", "requirements*.txt",
                   "go.mod", "go.sum", "Cargo.toml", "Cargo.lock"]
docs_globs: ["docs/**", "**/*.md", "**/*.rst"]

small_fix_max_lines: 150
