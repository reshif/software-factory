<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* A deliberate single dark world: an operations console for a factory floor. */
:root{
  color-scheme:dark;
  --bg:#0A1016; --bg2:#0E1620; --panel:#121C27; --panel2:#172331; --raise:#1D2B3B;
  --line:#243446; --line2:#2F4358;
  --ink:#E6EDF3; --ink2:#B9C6D3; --muted:#7F92A6;
  --ice:#8CC4FF; --ice-d:#16304B;
  --brass:#E1AE52; --brass-d:#3A2C12;
  --ok:#5ED39A; --ok-d:#123526; --warn:#F2B35B; --warn-d:#3A2A12; --crit:#FF7A6B; --crit-d:#3D1814;
  --run:#7EA6FF; --run-d:#18264A; --idle:#6F8193; --idle-d:#1A2530;
  --ui:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:13.5px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.005em;text-wrap:balance}

.app{display:grid;grid-template-columns:268px minmax(0,1fr) 320px;grid-template-rows:52px minmax(0,1fr) 30px;min-height:100%;
  padding-inline:16px;gap:0 14px}
@media (max-width:1180px){.app{grid-template-columns:240px minmax(0,1fr)}.inspector{grid-column:1/-1}}
@media (max-width:760px){.proj .crumb{display:none}.pf{margin-left:0;width:100%}.pf button{flex:1;justify-content:center;flex-direction:column;align-items:center;gap:0}.top .ro{display:none}#mmeta .wt{display:none}}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto}.main{order:1}.rail{order:2}.inspector{order:3}.status{order:4}}

/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);flex-wrap:wrap;padding-block:8px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.logo svg{flex:none}
.crumb{color:var(--muted)}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-width:220px;color:var(--muted)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink2)}
.ro{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-d)}
.sample{font-size:11.5px;color:var(--warn);background:var(--warn-d);border-radius:999px;padding:3px 10px;font-weight:600}
.conn-ok{color:var(--ok);background:var(--ok-d)}.conn-crit{color:var(--crit);background:var(--crit-d)}.conn-warn{color:var(--warn);background:var(--warn-d)}

/* rail */
.rail{padding-block:14px;display:flex;flex-direction:column;gap:10px;min-width:0;border-right:1px solid var(--line);padding-right:14px}
@media (max-width:760px){.rail{border-right:0;padding-right:0}}
.mcard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:7px}
.mcard:hover{border-color:var(--line2);background:var(--panel2)}
.mcard[aria-current="true"]{border-color:var(--ice);box-shadow:inset 3px 0 0 var(--ice);background:var(--panel2)}
.mhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mtitle{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mhead .mono{white-space:nowrap;flex:none}
.mnote{font-size:11.5px;color:var(--brass);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mnote.k-blocked{color:var(--crit)}.mnote.k-ci{color:var(--ok)}
.prog{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.prog span{height:4px;border-radius:2px;background:var(--line)}
.prog .d{background:var(--ok)} .prog .n{background:var(--run)} .prog .b{background:var(--crit)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap;letter-spacing:.02em}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{color:var(--ok);background:var(--ok-d)} .c-warn{color:var(--warn);background:var(--warn-d)} .c-crit{color:var(--crit);background:var(--crit-d)}
.c-run{color:var(--run);background:var(--run-d)} .c-idle{color:var(--idle);background:var(--idle-d)} .c-brass{color:var(--brass);background:var(--brass-d)} .c-ice{color:var(--ice);background:var(--ice-d)}

/* main */
.main{padding-block:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.mission-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between}
.mission-head h1{font-size:21px}
.req{color:var(--ink2);max-width:80ch}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi svg{display:block}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ice)}
.view{min-height:0}

/* floor */
.stage{position:relative;height:clamp(340px,62vh,680px);touch-action:none;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 20%,#14223A 0%,#0A1220 50%,#05080D 100%)}
.stage canvas{display:block;width:100%;height:100%;cursor:grab}
.stage canvas:active{cursor:grabbing}
.stagebar{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;pointer-events:none}
.stagebar>*{pointer-events:auto}
.switch{display:inline-flex;background:rgba(12,19,28,.82);border:1px solid var(--line2);border-radius:10px;padding:3px;gap:2px;backdrop-filter:blur(8px)}
.switch button{background:none;border:0;border-radius:7px;padding:6px 14px;font-weight:600;font-size:12.5px;color:var(--muted)}
.switch button[aria-selected="true"]{background:var(--ice-d);color:var(--ice);box-shadow:inset 0 0 0 1px #2D5A85}
.caption{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-start;justify-content:space-between;padding-top:10px}
.howto{margin:0;max-width:78ch;color:var(--ink2);font-size:13px}
.hud .row{display:flex;gap:6px;flex-wrap:wrap}
.controls{display:flex;gap:6px}
.ctl{background:rgba(18,28,39,.85);border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:12px;backdrop-filter:blur(6px)}
.ctl[aria-pressed="true"]{border-color:var(--ice);color:var(--ice)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tooltip{position:absolute;pointer-events:none;background:var(--raise);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translate(12px,12px)}
.nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink2)}

/* panels used by tabs */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.gantt{overflow-x:auto}
.g{min-width:760px;display:grid;grid-template-columns:150px repeat(24,1fr);row-gap:8px;align-items:center}
.gax{white-space:nowrap;overflow:visible;font-size:10.5px;color:var(--muted);border-left:1px solid var(--line);padding-left:4px;height:18px}
.gbar{height:26px;border-radius:6px;display:flex;align-items:center;padding:0 9px;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;border:1px solid transparent}
.gb-ok{background:var(--ok-d);color:var(--ok);border-color:#2A6B4B}.gb-run{background:var(--run-d);color:var(--run);border-color:#34508F}
.gb-idle{background:transparent;color:var(--idle);border:1px dashed var(--idle)}.gb-crit{background:var(--crit-d);color:var(--crit);border-color:#7A3329}.gb-ice{background:var(--ice-d);color:var(--ice);border-color:#2D5A85}
.gb-brass{background:var(--brass-d);color:var(--brass);border-color:#7A5A22}
.concern{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--panel2)}
.concern.acc{border-left-color:var(--brass)}
.feed .ev{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.feed .ev:last-child{border-bottom:0}
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.phases{grid-template-columns:minmax(0,1fr)}}
.phases ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;color:var(--ink2)}

/* inspector */
.inspector{padding-block:14px;display:flex;flex-direction:column;gap:12px;min-width:0;border-left:1px solid var(--line);padding-left:14px}
@media (max-width:1180px){.inspector{border-left:0;padding-left:0;border-top:1px solid var(--line)}}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.checks{display:flex;flex-direction:column;gap:6px}
.checks div{display:flex;gap:8px;align-items:flex-start}

/* portfolio strip, needs-you centre, stage stepper, gate report */
.proj{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.proj b{font-size:14px;font-weight:600}
.proj .crumb{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:36ch}
.pf{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.pf button{display:flex;align-items:baseline;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 11px;font-size:11.5px;color:var(--muted)}
.pf button:hover{border-color:var(--line2)}
.pf b{font-size:17px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.pf .t-crit b{color:var(--crit)}.pf .t-brass b{color:var(--brass)}.pf .t-ok b{color:var(--ok)}.pf .t-run b{color:var(--run)}
.pf .t-crit{border-color:#5A2A24}.pf .t-brass{border-color:#5C4620}
.halt{grid-column:1/-1;margin-top:10px;border:1px solid #7A3329;background:linear-gradient(90deg,var(--crit-d),transparent);color:var(--crit);border-radius:10px;padding:9px 14px;font-weight:600}
.needs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.need{text-align:left;display:flex;gap:10px;align-items:flex-start;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:10px;padding:9px 12px}
.need:hover{border-color:var(--line2)}
.need.k-blocked{border-left-color:var(--crit)}.need.k-ci{border-left-color:var(--ok)}.need.k-stale,.need.k-paused{border-left-color:var(--warn)}
.need .ic{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--brass-d);color:var(--brass)}
.need.k-blocked .ic{background:var(--crit-d);color:var(--crit)}.need.k-ci .ic{background:var(--ok-d);color:var(--ok)}.need.k-stale .ic,.need.k-paused .ic{background:var(--warn-d);color:var(--warn)}
.need span{display:block}.need .nh{display:flex;gap:8px;align-items:baseline;white-space:nowrap;overflow:hidden}.need .nh>span{display:inline}
.need .nt{font-size:12.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:760px){.pf button{font-size:10.5px;padding:5px 4px}.pf b{font-size:16px}}
.need code{font-family:var(--mono);font-size:11.5px;color:var(--brass);background:var(--brass-d);border-radius:4px;padding:0 4px}
.stepper{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 10px 10px;position:relative}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;min-width:0}
.step::before{content:"";position:absolute;top:10px;left:-50%;width:100%;height:2px;background:var(--line)}
.step:first-child::before{display:none}
.step.d::before,.step.n::before,.step.b::before{background:var(--ok)}
.step i{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;background:var(--bg2);border:2px solid var(--line2);color:var(--muted)}
.step.d i{background:var(--ok-d);border-color:var(--ok);color:var(--ok)}
.step.n i{background:var(--run);border-color:var(--run);color:#0A1016;box-shadow:0 0 0 5px var(--run-d),0 0 18px var(--run);animation:pulse 2.2s ease-in-out infinite}
.step.b i{background:var(--crit);border-color:var(--crit);color:#0A1016;box-shadow:0 0 0 5px var(--crit-d),0 0 18px var(--crit)}
.step span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.step.n span,.step.b span{color:var(--ink)}
.step .hold{font-size:10px;color:var(--crit);letter-spacing:.02em;text-transform:none}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--run-d),0 0 26px var(--run)}}
@media (max-width:620px){.step span{font-size:9px;letter-spacing:0}.stepper{padding-inline:4px}}
.segbar{display:flex;gap:3px;height:6px}.segbar span{flex:1;border-radius:3px;background:var(--line)}
.segbar .ok{background:var(--ok)}.segbar .run{background:var(--run)}.segbar .crit{background:var(--crit)}
.kpi .sub{font-size:11.5px;color:var(--muted)}
.kpi{position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--accent,transparent);opacity:.8}
.verdict{display:flex;gap:14px;align-items:center;border-radius:12px;padding:14px 16px;border:1px solid var(--line)}
.verdict .big{font-size:22px;font-weight:700;letter-spacing:-.01em}
.verdict.pass{background:linear-gradient(90deg,var(--ok-d),transparent 70%);border-color:#2A6B4B}.verdict.pass .big{color:var(--ok)}
.verdict.fail{background:linear-gradient(90deg,var(--crit-d),transparent 70%);border-color:#7A3329}.verdict.fail .big{color:var(--crit)}
.verdict.none{background:linear-gradient(90deg,var(--idle-d),transparent 70%)}
.ring{flex:none}
.gcols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
@media (max-width:1000px){.gcols{grid-template-columns:minmax(0,1fr)}}
.gl{display:flex;flex-direction:column;gap:0}
.gl div{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:start}
.gl div:last-child{border-bottom:0}
.gl b{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;margin-top:1px}
.gl .x b{background:var(--crit-d);color:var(--crit)}.gl .w b{background:var(--warn-d);color:var(--warn)}.gl .v b{background:var(--ok-d);color:var(--ok)}.gl .o b{background:var(--idle-d);color:var(--idle)}
.conn-ok::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.25}}
.status{grid-column:1/-1;display:flex;align-items:center;gap:18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);overflow-x:auto;white-space:nowrap}
.status b{color:var(--ink2);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head><body>
<div class="app">
  <header class="top">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="12" width="6" height="9" rx="1.5" fill="#8CC4FF"/><rect x="8" y="7" width="6" height="14" rx="1.5" fill="#5ED39A"/><rect x="15" y="2" width="6" height="19" rx="1.5" fill="#E1AE52"/></svg>
      Mission Deck
    </div>
    <div class="proj"><b id="proj">—</b><span class="crumb mono" id="crumb"></span></div>
    <span class="sample conn-warn" id="conn">Connecting…</span>
    <div class="pf" id="pf" aria-label="Portfolio"></div>
    <span class="ro" title="Approvals are recorded from your own chat message or terminal, never from this page">Read-only</span>
  </header>
  <div class="halt" id="halt" hidden></div>

  <aside class="rail" aria-label="Missions">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="lbl">Missions</span><span class="muted mono" id="mcount"></span></div>
    <div id="mlist" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="card" style="gap:6px">
      <span class="lbl">Workspace</span>
      <div class="kv" id="workspace"></div>
    </div>
    <div class="card" style="gap:6px">
      <span class="lbl">Knowledge</span>
      <div class="kv" id="knowledge"></div>
      <p class="muted" style="margin:0;font-size:11.5px">Saved only with your approval; every save is in the ledger.</p>
    </div>
  </aside>

  <main class="main" id="main">
    <div id="needs-wrap" hidden><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px"><span class="lbl" style="color:var(--brass)">Needs you</span><span class="muted" style="font-size:11.5px">Approvals happen in your chat or terminal</span></div><div class="needs" id="needs"></div></div>
    <div class="mission-head">
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
        <span class="lbl" id="mmeta"></span>
        <h1 id="mname"></h1>
        <p class="req" id="mreq" style="margin:0"></p>
      </div>
      <span id="mstate"></span>
    </div>
    <div class="stepper" id="stepper" aria-label="Mission stage"></div>
    <div class="kpis" id="kpis"></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <section class="view" id="view-floor" role="tabpanel">
      <div class="stage" id="stage">
        <canvas id="gl" aria-label="Interactive 3D view of your missions. Drag to rotate, scroll or pinch to zoom, click an object to inspect it."></canvas>
        <div class="stagebar">
          <div class="switch" role="tablist" aria-label="3D view" id="vswitch">
            <button role="tab" data-v="galaxy" aria-selected="true">Galaxy</button>
            <button role="tab" data-v="orbit" aria-selected="false">Orbit</button>
            <button role="tab" data-v="floor" aria-selected="false">Floor</button>
          </div>
          <div class="controls">
            <button class="ctl" id="b-play" aria-pressed="true">Motion</button>
            <button class="ctl" id="b-reset">Reset view</button>
          </div>
        </div>
        <div class="tooltip" id="tip" hidden></div>
      </div>
      <div class="caption">
        <p class="howto" id="howto"></p>
        <div class="legend" id="legend"></div>
      </div>
    </section>

function gateView(m){

 const right=`<div style="display:flex;flex-direction:column;gap:12px"><div class="card"><h3>Independent reviews</h3><div class="gl">${reviews.map(([k,st,v])=>row(st==="pass"?"v":st==="missing"?"o":"x",st==="pass"?"✓":st==="missing"?"·":"✕",`<b style="all:unset;font-weight:600">${k}</b> <span class="muted">${st==="missing"?"not recorded":st+(v&&v.findings&&v.findings.length?` · ${v.findings.length} finding(s)`:"")}</span>`)).join("")}</div></div>
  <div class="card"><h3>Your approvals</h3><div class="gl">${approvals.map(([k,d])=>row(d?"v":"o",d?"✓":"·",`<b style="all:unset;font-weight:600">${k}</b> <span class="muted">${d?esc(d.reference.replace(/^Approved in Claude Code chat: /,"chat: "))+" · "+clock(d.recorded_at):"not given yet"}</span>`)).join("")}</div></div>
  ${m.optionsRaw?`<div class="card"><h3>Options graded before building</h3><div class="gl">${(m.optionsRaw.options||[]).map(o=>row(o===m.optionsRaw.winner?"v":"o",o===m.optionsRaw.winner?"★":"·",`<b style="all:unset;font-weight:600">${esc(o)}</b> <span class="muted">${Object.entries((m.optionsRaw.scores||{})[o]||{}).map(([c,v])=>`${esc(c)} ${v}/5`).join(" · ")||"not scored"}${o===m.optionsRaw.winner?" · winner":""}</span>`)).join("")}</div><p class="muted" style="margin:0;font-size:11.5px">Graded by ${esc(m.optionsRaw.grader||"—")}, separately from the planner.</p></div>`:""}
  <div class="card"><h3>Acceptance criteria</h3><div class="gl">${trace.map(t=>row(t.verdict==="pass"?"v":t.verdict?"x":"o",t.verdict==="pass"?"✓":t.verdict?"✕":"·",`<span class="mono">${t.id}</span> ${esc(t.text||"")}`)).join("")||row("o","·","No criteria recorded yet.")}</div></div></div>`;

  pos.set([r*Math.sin(ph)*Math.cos(th),r*Math.cos(ph)*.6,r*Math.sin(ph)*Math.sin(th)],i*3);

 anim.push((ts,dt)=>{if(playing)sun.rotation.y+=dt*.2;corona.material.opacity=(tn==="crit"?.35+.3*(.5+.5*Math.sin(ts/300)):.5+.08*Math.sin(ts/700))});
 const sl=label(m.title,`${m.id} · ${m.state.replace("_"," ")}`,CSSC[tn],15);sl.position.set(0,7.2,0);scene.add(sl);
 const R=k=>6.5+k*3.9, at=m.at;
 STAGES.forEach((s,k)=>{const done=k<at,now=k===at,col=done?HEX.ok:now?(m.blocked?HEX.crit:HEX.run):HEX.idle;
  const r=ring(R(k),col,done?.75:now?1:.22);scene.add(r);
  if(now){const band=new THREE.Mesh(new THREE.TorusGeometry(R(k),.09,8,200),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.95}));band.rotation.x=Math.PI/2;scene.add(band);
   const bg=glow(col,6,.5);scene.add(bg);let a=0;anim.push((ts,dt)=>{if(playing)a+=dt*.25;bg.position.set(Math.cos(a)*R(k),0,Math.sin(a)*R(k))})}
  const lab=label(s.replace("_"," "),done?"done":now?(m.blocked?"blocked here":"in progress"):"",done?CSSC.ok:now?(m.blocked?CSSC.crit:CSSC.run):CSSC.idle,8.2);
  const ang=.62-k*.07;lab.position.set(Math.cos(ang)*R(k),1.3,Math.sin(ang)*R(k));scene.add(lab);
  const hit=new THREE.Mesh(new THREE.TorusGeometry(R(k),.5,6,120),new THREE.MeshBasicMaterial({visible:false}));hit.rotation.x=Math.PI/2;scene.add(hit);
  hit.userData.info={kind:"station",name:s.replace("_"," "),cls:done?"c-ok":now?(m.blocked?"c-crit":"c-run"):"c-idle",word:done?"done":now?(m.blocked?"blocked":"in progress"):"not yet",text:STAGE_TEXT[s]};picks.push(hit)});
 const gates=[[1,"Scope approval",m.floor.scope,m.floor.done.includes("scope")],[5,"Readiness gate",m.status.gate==="pass"?"Gate passed on the integrated candidate.":"Open gate reasons: "+m.status.gate+".",m.status.gate==="pass"]];
 gates.forEach(([k,name,text,ok])=>{const r=R(k)-1.95;const tor=new THREE.Mesh(new THREE.TorusGeometry(r,.16,12,200),new THREE.MeshStandardMaterial({color:HEX.brass,emissive:HEX.brass,emissiveIntensity:ok?.8:.12,metalness:.8,roughness:.3,transparent:true,opacity:ok?1:.45}));
  tor.rotation.x=Math.PI/2;scene.add(tor);tor.userData.info={kind:"gate",name,text};picks.push(tor);
  const gl=label(name,ok?"approved":"waiting for you",CSSC.brass,8.4);gl.position.set(Math.cos(2.35)*r,1.8,Math.sin(2.35)*r);scene.add(gl)});
 m.tasks.forEach((t,k)=>{const stage=t.state==="idle"?1:t.state==="ok"?Math.max(3,Math.min(at,5)):2;const rad=R(stage);
  const p=new THREE.Mesh(new THREE.SphereGeometry(1.05,32,24),mat(HEX[t.state],.55,.4,.2));scene.add(p);const pg=glow(HEX[t.state],5,.65);p.add(pg);
  const pl=label(`${t.id} · ${t.name}`,t.who,CSSC[t.state],8.6);pl.position.set(0,2.9,0);p.add(pl);
  p.userData.info={kind:"task",t,mi:cur};picks.push(p);
  let a=.9+k*1.7;const speed=t.state==="run"?.22+.05*k:0;
  anim.push((ts,dt)=>{if(playing)a+=dt*speed;p.position.set(Math.cos(a)*rad,0,Math.sin(a)*rad);if(t.state==="crit")pg.material.opacity=.3+.6*(.5+.5*Math.sin(ts/260))})});
}
const STAGE_TEXT={PROPOSED:"Request recorded, interviewed and assessed; spec and plan drafted.",PLANNED:"Scope accepted after your approval; tasks defined with owned paths.",
 IMPLEMENTING:"Implementers work in parallel lanes, one worktree each.",VERIFYING:"Checks run and evidence is bound to the exact code.",
 REVIEWING:"Code, acceptance and adversarial reviews on the integrated result.",READY_PR:"The readiness gate passed; local evidence is consistent.",MERGED:"You recorded CI and the merge; a real merge commit contains the work."};

/* Floor: the conveyor view. */
const X={intake:-26,interview:-20.5,assess:-15,spec:-9.5,scope:-4.8,laneA:-1.5,laneB:11,integrate:15.5,review:20.5,gate:25.2,ready:30};
function box(w,h,d,color,x,y,z,em=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color,em));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function beltSeg(x1,z1,x2,z2){const len=Math.hypot(x2-x1,z2-z1),a=Math.atan2(z2-z1,x2-x1);
 const b=new THREE.Mesh(new THREE.BoxGeometry(len,.22,1.5),mat(HEX.belt,0,.8,.1));b.position.set((x1+x2)/2,.12,(z1+z2)/2);b.rotation.y=-a;b.receiveShadow=true;scene.add(b);
 for(const s of[-1,1]){const r=new THREE.Mesh(new THREE.BoxGeometry(len,.28,.12),mat(HEX.steel,0,.4,.6));r.position.set((x1+x2)/2+Math.sin(a)*s*.8,.2,(z1+z2)/2-Math.cos(a)*s*.8);r.rotation.y=-a;scene.add(r)}}
function station(key,name,sub,state,text){const color=state==="done"?HEX.ok:state==="now"?HEX.run:HEX.idle,em=state==="now"?.35:state==="done"?.12:.02;
 const base=box(3.4,.5,3.4,HEX.steel,X[key],.25,0),top=box(2.6,1.6,2.6,color,X[key],1.3,0,em);if(state==="todo"){top.material.transparent=true;top.material.opacity=.55}
 const info={kind:"station",name,cls:state==="done"?"c-ok":state==="now"?"c-run":"c-idle",word:state==="done"?"done":state==="now"?"in progress":"not yet",text};
 top.userData.info=info;base.userData.info=info;picks.push(top,base);
 const l=label(name,sub,state==="done"?CSSC.ok:state==="now"?CSSC.run:CSSC.idle);l.position.set(X[key],4.1,0);scene.add(l);
 if(state==="now")anim.push(ts=>{top.material.emissiveIntensity=.25+.2*Math.sin(ts/420)})}
function gateArch(key,name,text,approved){const c=approved?HEX.brass:HEX.idle,em=approved?.45:.05,g=new THREE.Group();
 const p1=new THREE.Mesh(new THREE.BoxGeometry(.5,4,.5),mat(c,em,.35,.7)),p2=p1.clone(),beam=new THREE.Mesh(new THREE.BoxGeometry(.5,.5,4.4),mat(c,em,.35,.7));
 p1.position.set(0,2,-2);p2.position.set(0,2,2);beam.position.set(0,4.1,0);[p1,p2,beam].forEach(o=>{o.castShadow=true;g.add(o)});g.position.set(X[key],0,0);scene.add(g);
 const info={kind:"gate",name,text};[p1,p2,beam].forEach(o=>{o.userData.info=info;picks.push(o)});
 const l=label(name,approved?"approved":"waiting for you",CSSC.brass);l.position.set(X[key],6.1,0);scene.add(l)}
function buildFloor(){
 const m=MISSIONS[cur];scene.fog=new THREE.Fog(0x0A1016,70,140);renderer.shadowMap.enabled=true;
 stars(900,180,380,2);
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(90,44),new THREE.MeshStandardMaterial({color:HEX.floor,roughness:.95,metalness:0}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
 const grid=new THREE.GridHelper(90,45,0x1E3044,0x152332);grid.position.y=.01;scene.add(grid);
 const done=new Set(m.floor.done),st=k=>done.has(k)?"done":m.floor.now===k?"now":"todo";
 beltSeg(X.intake,0,X.laneA,0);beltSeg(X.integrate,0,X.ready,0);
 station("intake","Intake","request.md verbatim",st("intake"),"Your request stored byte for byte and scanned for secrets.");
 station("interview","Interview","rounds + defaults",st("interview"),"Grounded questions in rounds, each with a suggested default.");
 station("assess","Assessment","blockers · concerns",st("assess"),"The planner's challenge: blockers, concerns with evidence, risks.");
 station("spec","Spec + plan","criteria quote you",st("spec"),"spec.md, criteria quoting your words, plan with architecture.");
 gateArch("scope","Scope approval",m.floor.scope,done.has("scope"));
 const zs=m.tasks.length===1?[0]:m.tasks.length===2?[-4,4]:[-6.5,0,6.5];
 m.tasks.forEach((t,i)=>{const z=zs[i],c=HEX[t.state];
  beltSeg(X.laneA-1.2,0,X.laneA+1.2,z);beltSeg(X.laneA+1.2,z,X.laneB-1.2,z);beltSeg(X.laneB-1.2,z,X.integrate-1.4,0);
  const bay=box(X.laneB-X.laneA-2.4,.08,3.4,c,(X.laneA+X.laneB)/2,.02,z,.06);bay.material.transparent=true;bay.material.opacity=.18;
  const lab=label(`${t.id} · ${t.name}`,t.tree==="not created"?"queued":"worktree "+t.id,CSSC[t.state],7.6);lab.position.set((X.laneA+X.laneB)/2,2.9,z-2.6);scene.add(lab);
  if(t.state!=="idle"){const agent=new THREE.Mesh(new THREE.CylinderGeometry(.45,.55,1.5,20),mat(0xC9D6E3,.05,.4,.3));agent.position.set(X.laneA+3,.95,z+2.2);agent.castShadow=true;
   const head=new THREE.Mesh(new THREE.SphereGeometry(.42,20,16),mat(c,.5,.3,.2));head.position.set(0,1.05,0);agent.add(head);scene.add(agent);
   agent.userData.info=head.userData.info={kind:"task",t,mi:cur};picks.push(agent,head)}
  const v=box(1.4,1.2,1.8,t.state==="crit"?HEX.crit:HEX.steel,X.laneB-2.4,.8,z,t.state==="crit"?.4:.05);v.userData.info={kind:"task",t,mi:cur};picks.push(v);
  const p=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),mat(c,t.state==="run"?.55:.25,.3,.2));p.castShadow=true;
  const x0=X.laneA+1.6,x1=X.laneB-3.4;p.position.set(t.state==="idle"?x0-.2:x0+(x1-x0)*t.progress,.8,z);p.userData.info={kind:"task",t,mi:cur};scene.add(p);picks.push(p);
  const speed=.035+.02*i;anim.push((ts,dt)=>{if(!playing)return;if(t.state==="run"){p.position.x+=speed*60*dt;if(p.position.x>x1)p.position.x=x0;p.rotation.y+=dt*.8}
   if(t.state==="crit")p.material.emissiveIntensity=.35+.35*Math.sin(ts/260)});
  if(t.deps.length){const q=label("waits on "+t.deps.join(", "),null,CSSC.idle,5);q.position.set(x0,1.9,z);scene.add(q)}});
 station("integrate","Integrate","merge lanes",st("integrate"),"Finished lanes merge into the mission branch; a conflict blocks only that lane.");
 station("review","Reviews","code · acceptance · adversarial",st("review"),"Read-only reviewers; the reviewer must differ from the maintainer.");
 gateArch("gate","Readiness gate",m.status.gate==="pass"?"Gate passed on the integrated candidate.":"Open gate reasons: "+m.status.gate+".",m.status.gate==="pass");
 station("ready","READY_PR","packet + CI",st("ready"),"Local evidence consistent; you record CI and the merge.");
}

function buildView(instant){if(!renderer)return;clearScene();if(!MISSIONS.length){stars(2000,160,420,2.2);resize();return}({galaxy:buildGalaxy,orbit:buildOrbit,floor:buildFloor})[view]();
 if(instant)home(true);resize()}
function setView(v,{fly=true}={}){view=v;document.querySelectorAll("#vswitch button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
 $("howto").textContent=HOW[v];$("legend").innerHTML=LEGEND[v].map(([c,t])=>`<span><i style="background:${CSSC[c]}"></i>${t}</span>`).join("");
 buildView(false);home(!fly)}
function flyToMission(i){if(view!=="galaxy")return;const p=new THREE.Vector3(...galaxyPos(i));setGoal({target:p,r:stageEl.clientWidth<640?46:34,phi:1.05})}

/* controls: drag rotate, shift/right-drag pan, wheel or pinch zoom, click inspect */
function setCam(){const t=cam.target;camera.position.set(t.x+cam.r*Math.sin(cam.phi)*Math.cos(cam.theta),t.y+cam.r*Math.cos(cam.phi),t.z+cam.r*Math.sin(cam.phi)*Math.sin(cam.theta));camera.lookAt(t)}
function resize(){if(!renderer)return;const r=stageEl.getBoundingClientRect();if(!r.width)return;renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
function bindControls(){
 const ptrs=new Map();let drag=null,moved=0,pinch=null,lastClick=0;
 canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),r:goal.r};drag=null}
  else drag={x:e.clientX,y:e.clientY,th:goal.theta,ph:goal.phi,pan:e.shiftKey||e.button===2,tx:goal.target.x,tz:goal.target.z}});
 canvas.addEventListener("pointermove",e=>{if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];goal.r=Math.min(160,Math.max(14,pinch.r*pinch.d/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))));moved=99;return}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);
   if(drag.pan){goal.target.x=drag.tx-dx*.07;goal.target.z=drag.tz-dy*.07}else{goal.theta=drag.th+dx*.006;goal.phi=Math.min(1.5,Math.max(.12,drag.ph-dy*.005))}}
  if(e.pointerType==="mouse")hover(e)});
 const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(drag&&moved<6){const info=hit(e),now=performance.now();
   if(info&&info.kind==="mission"){openMission(info.mi);if(now-lastClick<380&&view==="galaxy"){setView("orbit")}else flyToMission(info.mi);lastClick=now;inspect(info)}
   else inspect(info||null)}
  drag=null};
 canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",up);
 canvas.addEventListener("pointerleave",()=>{tip.hidden=true});
 canvas.addEventListener("wheel",e=>{e.preventDefault();goal.r=Math.min(160,Math.max(14,goal.r*(1+Math.sign(e.deltaY)*.1)))},{passive:false});
 canvas.addEventListener("contextmenu",e=>e.preventDefault());
 $("b-reset").onclick=()=>home(false);
 $("b-play").onclick=e=>{playing=!playing;e.currentTarget.setAttribute("aria-pressed",playing)};
 document.querySelectorAll("#vswitch button").forEach(b=>b.onclick=()=>setView(b.dataset.v));
 new ResizeObserver(resize).observe(stageEl);
}
function hit(e){const r=canvas.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;
 raycaster.setFromCamera(pointer,camera);const h=raycaster.intersectObjects(picks,false)[0];return h&&h.object.userData.info}
function hover(e){const info=hit(e),r=stageEl.getBoundingClientRect();
 if(info){tip.hidden=false;tip.style.left=Math.min(e.clientX-r.left,r.width-220)+"px";tip.style.top=(e.clientY-r.top)+"px";
  tip.textContent=info.kind==="task"?`${info.t.id} · ${info.t.name} · ${WORD[info.t.state]}`:info.kind==="mission"?`${MISSIONS[info.mi].title} · ${MISSIONS[info.mi].state.replace("_"," ")} · click to fly, double-click for orbit`:info.name;
  canvas.style.cursor="pointer"}else{tip.hidden=true;canvas.style.cursor=""}}
let last=0;
function loop(ts){requestAnimationFrame(loop);if(!renderer||$("view-floor").hidden)return;const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 const k=1-Math.pow(.0015,dt);cam.theta+=(goal.theta-cam.theta)*k;cam.phi+=(goal.phi-cam.phi)*k;cam.r+=(goal.r-cam.r)*k;cam.target.lerp(goal.target,k);
 anim.forEach(f=>f(ts,dt));setCam();renderer.render(scene,camera)}

function render(){
 renderRail();
 if(!MISSIONS.length){$("mname").textContent="No open missions";$("mmeta").textContent="";$("mreq").textContent="Create one with software-factory mission create, or run /factory-build in your coding client.";$("kpis").innerHTML="";$("feed").innerHTML="";$("insp").innerHTML='<p class="muted" style="margin:0">Nothing to inspect yet.</p>';if(renderer){clearScene();stars(2000,160,420,2.2)}return}
 const m=MISSIONS[cur];renderHead(m);renderViews(m);inspect(null);if(renderer)buildView(false);
 const rg=document.getElementById("run-gate");if(rg)rg.onclick=runGate}
$("st-host").textContent=location.host;
const gl=initGL();renderTabs();
if(gl){view="galaxy";setView("galaxy",{fly:false});requestAnimationFrame(loop)}else{$("howto").textContent=HOW.galaxy}
showTab();
if(!TOKEN){setConn("Open the URL printed by software-factory serve (it carries the session token)","crit")}else{refresh().then(stream)}
document.addEventListener("keydown",e=>{if(e.target.closest("input,textarea"))return;const n=+e.key;
 if(n>=1&&n<=TABS.length){tab=TABS[n-1][0];renderTabs();showTab()}
 const v={g:"galaxy",o:"orbit",f:"floor"}[e.key];if(v&&gl&&tab==="floor")setView(v)});
</script>
