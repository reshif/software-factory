# Egress allowlist proxy for sandboxes running with network=True (final draft
# §12.2 M8, §13.1 #2). DockerSandbox joins the `factory-egress` docker network
# and points HTTP(S)_PROXY at this proxy; code never gets unrestricted internet.
User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0

Timeout 600
MaxClients 100

# Every FQDN not listed in filter.allowlist is refused (default-deny).
Filter "/etc/tinyproxy/filter.allowlist"
FilterType fqdn
FilterDefaultDeny Yes
FilterCaseSensitive No

LogLevel Info
