[project]
name = "factory-controller"
version = "0.1.0"
description = "Deterministic core of the software factory: gate resolution, coverage, approvals, state machine, intents"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.19", "rfc3339-validator>=0.1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
