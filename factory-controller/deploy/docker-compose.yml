# Reference production deployment (build spec §3 B7). One controller (serve),
# one worker, Postgres, the LLM gateway (B3's deploy/litellm/) and the egress
# allowlist proxy (B3's deploy/egress-proxy/). `factory-sandbox:latest`
# (deploy/sandbox/Dockerfile) is built separately and used by `DockerSandbox`
# at runtime -- it is not a compose service.
#
# Run from the repo root:
#   docker compose -f factory-controller/deploy/docker-compose.yml --env-file factory-controller/deploy/.env up
#
# Secrets and settings come from `.env` (see `.env.example`, which documents
# every `FACTORY_*` variable) plus the files under `secrets:` below -- nothing
# is baked into the image or this file. The Postgres and LiteLLM passwords and
# the two GitHub App private keys are Compose secrets (files), never plain
# environment variables (red-team #2 item 8): `docker inspect`/`compose config`
# never show them, only the container reads the file at runtime.
#
# DockerSandbox needs to launch a container per task. This file does NOT give
# it that ability by default -- see "Running sandboxed tasks" below.

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  litellm_password:
    file: ./secrets/litellm_password.txt
  anthropic_api_key:
    file: ./secrets/anthropic_api_key.txt
  push_app_private_key:
    file: ./secrets/push-app.pem
  merge_app_private_key:
    file: ./secrets/merge-app.pem

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: factory
      LITELLM_PASSWORD_FILE: /run/secrets/litellm_password
    secrets: [postgres_password, litellm_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the SEPARATE `litellm` database/role on first init (item 8): the
      # gateway never gets a credential that can read the controller's own tables.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [factory-internal]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    secrets: [anthropic_api_key, litellm_password]
    # The upstream image has no secret-file convention of its own, so this reads
    # the mounted secrets into the process environment right before exec'ing the
    # real entrypoint -- still never a plain-text value in `environment:` below.
    entrypoint:
      - /bin/sh
      - -c
      - |
        export ANTHROPIC_API_KEY="$$(cat /run/secrets/anthropic_api_key)"
        export LITELLM_DATABASE_URL="postgresql://litellm:$$(cat /run/secrets/litellm_password)@postgres:5432/litellm"
        exec litellm --config /etc/litellm/config.yaml --port 4000
    environment:
      LITELLM_MASTER_KEY: ${FACTORY_LLM_GATEWAY_MASTER_KEY:?set FACTORY_LLM_GATEWAY_MASTER_KEY in .env}
    volumes:
      - ./litellm/config.yaml:/etc/litellm/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    # NOT on factory-egress (item 8): sandboxes reach the gateway only through
    # egress-proxy's allowlist, never directly.
    networks: [factory-internal]

  egress-proxy:
    image: vimagick/tinyproxy
    restart: unless-stopped
    volumes:
      - ./egress-proxy/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./egress-proxy/filter.allowlist:/etc/tinyproxy/filter.allowlist:ro
    # factory-internal: reaches litellm (by name) and the public internet (a
    # non-internal bridge network still NATs out) for package-mirror hosts.
    # factory-egress: the network sandboxes actually join.
    networks: [factory-egress, factory-internal]

  controller:
    build:
      context: ../..
      dockerfile: factory-controller/deploy/controller.Dockerfile
    restart: unless-stopped
    command: ["factory", "serve", "--host", "0.0.0.0", "--port", "8080"]
    env_file: [.env]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password  # entrypoint.sh builds FACTORY_DATABASE_URL from this
      FACTORY_LLM_GATEWAY_URL: http://litellm:4000
      FACTORY_EGRESS_PROXY_URL: http://egress-proxy:8888
      FACTORY_PUSH_APP_PRIVATE_KEY_PATH: /run/secrets/push_app_private_key
      FACTORY_MERGE_APP_PRIVATE_KEY_PATH: /run/secrets/merge_app_private_key
    secrets: [postgres_password, push_app_private_key, merge_app_private_key]
    ports:
      - "8080:8080"
    volumes:
      - kit-data:/var/lib/factory/kit:ro
      - products-data:/var/lib/factory/products:ro
      - sandbox-images:/var/lib/factory/sandboxes
      - repo-mirrors:/var/lib/factory/repos
      - evidence-data:/var/lib/factory/evidence
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
    networks: [factory-internal]

  worker:
    build:
      context: ../..
      dockerfile: factory-controller/deploy/controller.Dockerfile
    restart: unless-stopped
    command: ["factory", "worker", "--interval", "5"]
    env_file: [.env]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      FACTORY_LLM_GATEWAY_URL: http://litellm:4000
      FACTORY_EGRESS_PROXY_URL: http://egress-proxy:8888
      FACTORY_PUSH_APP_PRIVATE_KEY_PATH: /run/secrets/push_app_private_key
      FACTORY_MERGE_APP_PRIVATE_KEY_PATH: /run/secrets/merge_app_private_key
    secrets: [postgres_password, push_app_private_key, merge_app_private_key]
    volumes:
      - kit-data:/var/lib/factory/kit:ro
      - products-data:/var/lib/factory/products:ro
      - sandbox-images:/var/lib/factory/sandboxes
      - repo-mirrors:/var/lib/factory/repos
      - evidence-data:/var/lib/factory/evidence
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
    networks: [factory-internal]

networks:
  # controller, worker, postgres and litellm talk to each other here. Sandbox
  # containers (started dynamically by DockerSandbox) are never attached to
  # this network -- they get `none`, or `factory-egress` when a task legitimately
  # needs package-mirror access (final draft §13.1 #2).
  factory-internal:
  # The ONLY network a network=True sandbox container joins. `internal: true`
  # (item 8): no route out except through a container also on factory-internal
  # (egress-proxy) -- a sandboxed task can reach the proxy's allowlist and
  # nothing else, not even other containers on this compose project directly.
  factory-egress:
    internal: true

volumes:
  postgres-data:
  # Populate kit-data/products-data from factory-kit/ and your product repos'
  # factory.yaml + mandates/ before starting (e.g. a one-shot init container or
  # `docker cp`); the kit gate (final draft §13.3) governs how they change.
  kit-data:
  products-data:
  sandbox-images:
  repo-mirrors:
  evidence-data:

# ── Running sandboxed tasks ──────────────────────────────────────────────────────
#
# `DockerSandbox` launches one container per task by shelling out to `docker run`.
# This compose file, by itself, gives `controller`/`worker` no way to do that --
# on purpose (red-team #2 item 8): mounting the host's Docker socket grants
# effectively host-root access to whatever holds it, which is a lot of blast
# radius for a process that also runs arbitrary agent-driven code. Two ways to
# actually run tasks, in order of preference:
#
#   1. (Recommended) A separate, rootless Docker-in-Docker (or Sysbox/gVisor)
#      daemon that `controller`/`worker` talk to over TCP+TLS, never a mounted
#      socket -- set `DOCKER_HOST=tcp://sandbox-dind:2376`,
#      `DOCKER_TLS_VERIFY=1`, `DOCKER_CERT_PATH=/certs/client` and give that
#      daemon its OWN, otherwise-empty host (or a dedicated VM/node). This
#      keeps a compromised controller from reaching the real Docker socket.
#   2. (Opt-in, loudly) `docker compose -f docker-compose.yml
#      -f docker-compose.docker-socket.yml up` mounts the real host socket into
#      `controller`/`worker` directly. Only do this on a host you're prepared to
#      treat as fully accessible to whatever those two containers run.
