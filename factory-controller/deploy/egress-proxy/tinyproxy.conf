# Egress allowlist proxy for sandboxes running with network=True (final draft
# §12.2 M8, §13.1 #2). DockerSandbox joins the `factory-egress` docker network
# and points HTTP(S)_PROXY at this proxy; code never gets unrestricted internet.
User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0

Timeout 600
MaxClients 100

# Every destination not matched by filter.allowlist is refused (default-deny).
#
# `FilterDefaultDeny Yes` is what makes this an ALLOWLIST rather than a
# blocklist: with it, only hostnames MATCHING a filter.allowlist pattern are
# permitted; everything else is refused (final draft §12.2 M8's "allows
# exactly two kinds of destination", not "blocks a few bad ones").
#
# There is no real tinyproxy `FilterType` directive (an earlier version of
# this file had one, `FilterType fqdn`, which tinyproxy does not recognize).
# The real directives are `FilterExtended` and `FilterURLs`:
#   - `FilterURLs No` (the default): filter.allowlist is matched against the
#     request's HOST, not the full URL.
#   - `FilterExtended Yes`: filter.allowlist entries are POSIX EXTENDED regular
#     expressions, not plain substrings. This matters because tinyproxy's
#     substring/basic matching would let a pattern like `pypi.org` match
#     `pypi.org.evil.tld` (the `.` isn't even anchored to be a literal dot) --
#     see filter.allowlist for the anchored (`^...$`) patterns this requires.
FilterExtended Yes
FilterURLs No
Filter "/etc/tinyproxy/filter.allowlist"
FilterDefaultDeny Yes
FilterCaseSensitive No

LogLevel Info
