name: holdout

# Controller-triggered black-box run against a staging digest (final draft
# §9.2, §13.1 #4). No agent identity can trigger or read this workflow's
# scenarios -- only the controller's read-only holdout identity.
#
# `run-name` carries the caller's `correlation_id` verbatim (Q-M3): the
# verification runner (B5) polls this workflow_dispatch run by matching on
# that exact run name, since the dispatch API doesn't hand back a run id.

run-name: holdout ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: "Staging URL to run scenarios against."
        required: true
        type: string
      correlation_id:
        description: "Opaque id the caller polls this run by (becomes the run-name, exactly)."
        required: true
        type: string
      artifact:
        description: "Artifact/digest under test (provenance only; the run itself is black-box)."
        required: false
        type: string

permissions:
  contents: read

jobs:
  run-holdouts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run black-box scenarios
        run: python runner/run_blackbox.py --staging-url "${{ inputs.staging_url }}" --scenarios-dir scenarios --out holdout-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: holdout-result
          path: holdout-result.json
