# LiteLLM proxy config for the factory's LLM gateway (final draft §12.2 M6, §13.1 #7).
#
# Agents never see a raw provider key. They get a per-mission virtual key
# (POST /key/generate, see src/factory/budget/litellm.py) with a hard
# max_budget; this proxy enforces that cap itself, so a runaway agent loop is
# stopped at the gateway even if the controller's own bookkeeping is wrong.
model_list:
  - model_name: claude-opus-5-5
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  # Admin key for /key/generate, /key/info, /key/delete. Set FACTORY_LLM_GATEWAY_MASTER_KEY
  # to the same value for the controller. Never commit a real value here.
  master_key: os.environ/LITELLM_MASTER_KEY
  # Persists virtual keys and spend across proxy restarts.
  database_url: os.environ/LITELLM_DATABASE_URL

litellm_settings:
  # Each virtual key's max_budget (set at /key/generate time) is a hard,
  # one-time cap for that mission, not a recurring allowance.
  budget_duration: null
  drop_params: true
