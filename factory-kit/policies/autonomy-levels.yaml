# Autonomy levels: named relaxations of the base gate table (L3).
# Spec: docs/software-factory-final-draft.md §15
# A relaxation may only name AC1–AC4. AC5–AC8 and protected paths are never relaxed.

schema_version: 1
policy_version: p-2026.10.2

levels:
  L3:
    relaxations: []

  L4:
    relaxations:
      - gate: hm
        classes: [AC1, AC2, AC3, AC4]
        profiles: [experimental, standard]
        to: auto_sampled          # auto merge + risk-weighted sampled audit
        sample_rate: 0.2
      - gate: hm
        classes: [AC1, AC2]
        profiles: [regulated]
        to: auto_sampled
        sample_rate: 0.2

  L5:
    inherits: L4
    relaxations:
      - gate: h2
        classes: [AC1, AC2, AC3]
        profiles: [experimental, standard]
        to: standing              # standing release mandate

never_relax: [AC5, AC6, AC7, AC8]
max_level_by_profile: { experimental: L5, standard: L5, regulated: L4 }
